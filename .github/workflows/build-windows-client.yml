name: Build Windows Inspector EXE

on:
  workflow_dispatch:
    inputs:
      session_code:
        description: "One-time code created on the dashboard (leave blank for a generic build)"
        required: false
        type: string
      dashboard_url:
        description: "HTTPS dashboard URL (required when session_code is supplied)"
        required: false
        type: string
  push:
    paths:
      - "dashboard_server.py"
      - "inspector_client.py"
      - "inspector_team.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-client.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Validate all Python source syntax
        run: python -m py_compile dashboard_server.py inspector_client.py inspector_team.py
      - name: Install client dependencies
        run: |
          python -m pip install psutil pillow pyinstaller
      - name: Configure one-time session (optional)
        if: ${{ inputs.session_code != '' }}
        shell: pwsh
        env:
          SESSION_CODE: ${{ inputs.session_code }}
          DASHBOARD_URL: ${{ inputs.dashboard_url }}
        run: |
          if ($env:SESSION_CODE -notmatch '^[A-Za-z0-9]{6,20}$') { throw "Session code must be 6-20 letters or digits." }
          if ($env:DASHBOARD_URL -notmatch '^https://[^/]+') { throw "A valid HTTPS dashboard URL is required for a session build." }
          @"
          SESSION_CODE = "$($env:SESSION_CODE.ToUpper())"
          DASHBOARD_URL = "$($env:DASHBOARD_URL.TrimEnd('/'))"
          "@ | Set-Content -Encoding utf8 session_config.py
      - name: Build transparent folder package
        shell: pwsh
        env:
          SESSION_CODE: ${{ inputs.session_code }}
        run: |
          $name = "3eN-Inspect"
          if ($env:SESSION_CODE) { $name = "$name-$($env:SESSION_CODE.ToUpper())" }
          # Standard onedir packaging: the EXE runs beside its visible support files.
          # This avoids a self-extracting onefile launcher; it does not alter scan behavior.
          if (Test-Path "session_config.py") {
            python -m PyInstaller --noconfirm --clean --noupx --onedir --windowed --name $name --hidden-import session_config inspector_client.py
          } else {
            python -m PyInstaller --noconfirm --clean --noupx --onedir --windowed --name $name inspector_client.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = Join-Path "dist" $name
          $exe = Join-Path $bundle "$name.exe"
          if (-not (Test-Path $exe)) { throw "EXE was not created: $exe" }
          Compress-Archive -Path $bundle -DestinationPath (Join-Path "dist" "$name.zip") -CompressionLevel Optimal
          if (-not (Test-Path (Join-Path "dist" "$name.zip"))) { throw "ZIP package was not created." }
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $zip = Get-Item "dist/*.zip"
          $zipHash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $($zip.Name)" | Set-Content -Encoding ascii (Join-Path "dist" "$($zip.Name).sha256")
          Write-Host "Package SHA-256: $zipHash"
      - name: Upload folder package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: 3eN-Inspect-${{ inputs.session_code || 'Generic' }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
