name: Build Windows Inspector EXE

on:
  workflow_dispatch:
    inputs:
      session_code:
        description: "One-time code created on the dashboard (leave blank for a generic build)"
        required: false
        type: string
      dashboard_url:
        description: "HTTPS dashboard URL (required when session_code is supplied)"
        required: false
        type: string
  push:
    paths:
      - "dashboard_server.py"
      - "inspector_client.py"
      - "inspector_team.py"
      - "requirements.txt"
      - "make_icon.py"
      - ".github/workflows/build-windows-client.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Validate all Python source syntax
        run: python -m py_compile dashboard_server.py inspector_client.py inspector_team.py
      - name: Install client dependencies
        run: |
          python -m pip install psutil pillow pyinstaller
      - name: Configure one-time session (optional)
        if: ${{ inputs.session_code != '' }}
        shell: pwsh
        env:
          SESSION_CODE: ${{ inputs.session_code }}
          DASHBOARD_URL: ${{ inputs.dashboard_url }}
        run: |
          if ($env:SESSION_CODE -notmatch '^[A-Za-z0-9]{6,20}$') { throw "Session code must be 6-20 letters or digits." }
          if ($env:DASHBOARD_URL -notmatch '^https://[^/]+') { throw "A valid HTTPS dashboard URL is required for a session build." }
          @"
          SESSION_CODE = "$($env:SESSION_CODE.ToUpper())"
          DASHBOARD_URL = "$($env:DASHBOARD_URL.TrimEnd('/'))"
          "@ | Set-Content -Encoding utf8 session_config.py
      - name: Generate 3EN application icon
        run: python make_icon.py
      - name: Build standalone EXE
        shell: pwsh
        env:
          SESSION_CODE: ${{ inputs.session_code }}
        run: |
          $name = "3eN-Inspect"
          if ($env:SESSION_CODE) { $name = "$name-$($env:SESSION_CODE.ToUpper())" }
          # A standard application directory; no self-extracting one-file bundle, packer, or obfuscation is used.
          if (Test-Path "session_config.py") {
            python -m PyInstaller --noconfirm --clean --noupx --onedir --windowed --name $name --icon 3en.ico --add-data "3en.ico;." --hidden-import session_config inspector_client.py
          } else {
            python -m PyInstaller --noconfirm --clean --noupx --onedir --windowed --name $name --icon 3en.ico --add-data "3en.ico;." inspector_client.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem "dist" -Filter "$name.exe" -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw "EXE was not created for: $name" }
      - name: Package complete application folder
        shell: pwsh
        run: |
          $appDir = Get-ChildItem "dist" -Directory | Select-Object -First 1
          if (-not $appDir) { throw "PyInstaller application folder was not created." }
          $exe = Get-ChildItem $appDir.FullName -Filter "*.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "EXE was not found inside the application folder." }
          $zipPath = Join-Path "dist" "$($appDir.Name).zip"
          Compress-Archive -Path (Join-Path $appDir.FullName "*") -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $([IO.Path]::GetFileName($zipPath))" | Set-Content -Encoding ascii "$zipPath.sha256"
          Write-Host "Package SHA-256: $zipHash"
      - name: Upload complete application ZIP
        uses: actions/upload-artifact@v4
        with:
          name: 3eN-Inspect-${{ inputs.session_code || 'Generic' }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
