name: Build Windows Inspector EXE

on:
  workflow_dispatch:
    inputs:
      session_code:
        description: "One-time code created on the dashboard (leave blank for a generic build)"
        required: false
        type: string
      dashboard_url:
        description: "HTTPS dashboard URL (required when session_code is supplied)"
        required: false
        type: string
  push:
    paths:
      - "dashboard_server.py"
      - "inspector_client.py"
      - "inspector_team.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-client.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Validate all Python source syntax
        run: python -m py_compile dashboard_server.py inspector_client.py inspector_team.py
      - name: Install client dependencies
        run: |
          python -m pip install psutil pillow pyinstaller
      - name: Configure one-time session (optional)
        if: ${{ inputs.session_code != '' }}
        shell: pwsh
        env:
          SESSION_CODE: ${{ inputs.session_code }}
          DASHBOARD_URL: ${{ inputs.dashboard_url }}
        run: |
          if ($env:SESSION_CODE -notmatch '^[A-Za-z0-9]{6,20}$') { throw "Session code must be 6-20 letters or digits." }
          if ($env:DASHBOARD_URL -notmatch '^https://[^/]+') { throw "A valid HTTPS dashboard URL is required for a session build." }
          @"
          SESSION_CODE = "$($env:SESSION_CODE.ToUpper())"
          DASHBOARD_URL = "$($env:DASHBOARD_URL.TrimEnd('/'))"
          "@ | Set-Content -Encoding utf8 session_config.py
      - name: Build standalone EXE
        shell: pwsh
        env:
          SESSION_CODE: ${{ inputs.session_code }}
        run: |
          $name = "3eN-Inspect"
          if ($env:SESSION_CODE) { $name = "$name-$($env:SESSION_CODE.ToUpper())" }
          # Build a single, uncompressed-by-UPX EXE. PyInstaller onefile may unpack
          # runtime support files into a temporary directory when launched; the
          # deliverable itself is one EXE. No obfuscation or UPX is used.
          if (Test-Path "session_config.py") {
            python -m PyInstaller --noconfirm --clean --noupx --onefile --windowed --name $name --hidden-import session_config inspector_client.py
          } else {
            python -m PyInstaller --noconfirm --clean --noupx --onefile --windowed --name $name inspector_client.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path "dist" "$name.exe"
          if (-not (Test-Path $exe)) { throw "EXE was not created: $exe" }
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "EXE was not created." }
          $exeHash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$exeHash  $($exe.Name)" | Set-Content -Encoding ascii (Join-Path "dist" "$($exe.Name).sha256")
          Write-Host "EXE SHA-256: $exeHash"
      - name: Upload standalone EXE and checksum
        uses: actions/upload-artifact@v4
        with:
          name: 3eN-Inspect-${{ inputs.session_code || 'Generic' }}
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
