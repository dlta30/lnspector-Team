name: Build Windows Inspector EXE

on:
  workflow_dispatch:
    inputs:
      session_code:
        description: "One-time code created on the dashboard (leave blank for a generic build)"
        required: false
        type: string
      dashboard_url:
        description: "HTTPS dashboard URL (required when session_code is supplied)"
        required: false
        type: string
  push:
    paths:
      - "dashboard_server.py"
      - "inspector_client.py"
      - "inspector_team.py"
      - "make_icon.py"
      - ".github/workflows/build-windows-client.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest repository version
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Validate all Python source syntax
        run: python -m py_compile dashboard_server.py inspector_client.py inspector_team.py
      - name: Install client dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil pillow reportlab pyinstaller
      - name: Configure one-time session (optional)
        if: ${{ inputs.session_code != '' }}
        shell: pwsh
        env:
          SESSION_CODE: ${{ inputs.session_code }}
          DASHBOARD_URL: ${{ inputs.dashboard_url }}
        run: |
          if ($env:SESSION_CODE -notmatch '^[A-Za-z0-9]{6,20}$') { throw "Session code must be 6-20 letters or digits." }
          if ($env:DASHBOARD_URL -notmatch '^https://[^/]+') { throw "A valid HTTPS dashboard URL is required for a session build." }
          @"
          SESSION_CODE = "$($env:SESSION_CODE.ToUpper())"
          DASHBOARD_URL = "$($env:DASHBOARD_URL.TrimEnd('/'))"
          "@ | Set-Content -Encoding utf8 session_config.py
      - name: Generate 3EN application icon
        run: python make_icon.py
      - name: Build standard Windows app bundle
        shell: pwsh
        env:
          SESSION_CODE: ${{ inputs.session_code }}
        run: |
          $name = "3eN-Inspect"
          if ($env:SESSION_CODE) { $name = "$name-$($env:SESSION_CODE.ToUpper())" }
          # Use onedir instead of onefile: avoids the self-extracting single-file bootloader.
          # No UPX, packer, obfuscation, or security-tool exclusions are used.
          if (Test-Path "session_config.py") {
            python -m PyInstaller --noconfirm --clean --noupx --onedir --windowed --name $name --icon 3en.ico --add-data "3en.ico;." --hidden-import session_config inspector_client.py
          } else {
            python -m PyInstaller --noconfirm --clean --noupx --onedir --windowed --name $name --icon 3en.ico --add-data "3en.ico;." inspector_client.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path (Join-Path "dist" $name) "$name.exe"
          if (-not (Test-Path $exe)) { throw "EXE was not created for: $name" }
          Compress-Archive -Path (Join-Path "dist" $name "*") -DestinationPath (Join-Path "dist" "$name.zip") -Force
      - name: Verify EXE and record SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist" -Filter "*.exe" -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Application EXE was not created." }
          if ($exe.Length -lt 1000000) { throw "EXE is unexpectedly small; refusing to publish." }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Application EXE SHA-256: $hash"
          $zip = Get-ChildItem "dist" -Filter "*.zip" -File | Select-Object -First 1
          if (-not $zip) { throw "Application bundle ZIP was not created." }
      - name: Upload the application bundle
        uses: actions/upload-artifact@v4
        with:
          name: 3eN-Inspect-${{ inputs.session_code || 'Generic' }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
