name: Build 3EN Inspector Team EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "inspector_team.py"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "3EN_Inspector_Team" inspector_team.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3EN-Inspector-Team-Windows
          path: dist/3EN_Inspector_Team.exe
          if-no-files-found: error
