[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3en-inspect-team"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0,<4.0",
    "pg8000>=1.31,<2.0",
    "reportlab>=4.0,<5.0",
    "gunicorn>=23.0,<24.0",
    "arabic-reshaper>=3.0.0,<4.0",
    "python-bidi>=0.6.0,<1.0",
    "fontpkg-noto-naskh-arabic>=2.21,<3.0",
]

[tool.setuptools]
py-modules = ["dashboard_server"]

[dependency-groups]
dev = [
    "workers-py>=1.9,<2.0",
    "workers-runtime-sdk>=1.0",
]
